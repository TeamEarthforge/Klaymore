# =========================================================================
# Klaymore 脚本项目生成器 - 唯一配置文件
# =========================================================================
# 【重要】你只需要修改这一个文件！全部填写 JAR 路径即可，不需要懂 Gradle 语法。
# 修改后重新运行 generate.bat（Windows）或 ./generate.sh 生成项目。
#
# 路径说明：
#   - 推荐使用绝对路径（如 F:/MCRPG/mods/xxx.jar 或 /home/user/mods/xxx.jar）
#   - Windows 路径用正斜杠 / 或双反斜杠 \\
#   - 路径中有空格没问题，无需引号
# =========================================================================

# -------------------------------------------------------------------------
# 1. 项目基本信息（一般不用改）
# -------------------------------------------------------------------------
# 生成的 Gradle 项目名
projectName=klaymore-scripts

# 项目输出目录（相对/绝对路径均可）
outputDir=generated-project

# Mod 包名：应与 Klaymore 的 gradle.properties 中 modGroup 一致
modGroup=com.earthforge.klaymore

# Klaymore 脚本注解 API 包（无需修改，除非你 fork 了 Klaymore）
scriptApiPackage=com.earthforge.klaymore.script

# -------------------------------------------------------------------------
# 2. 版本信息（必须与你运行服务端的版本一致）
# -------------------------------------------------------------------------
minecraftVersion=1.7.10
forgeVersion=10.13.4.1614
mappingsChannel=stable
mappingsVersion=12
kotlinVersion=2.2.21

# -------------------------------------------------------------------------
# 3. Klaymore Mod JAR 路径【必须填写】
# -------------------------------------------------------------------------
# 提供 @Subscribe 注解和脚本运行时 API。
# 填 Klaymore 构建产物中的 *-dev.jar（已反混淆版本）
# 示例（Windows）: klaymoreJar=F:/MCRPG/Klaymore/build/libs/klaymore-1.0.0-dev.jar
# 示例（Linux）:   klaymoreJar=/home/user/klaymore/build/libs/klaymore-1.0.0-dev.jar
klaymoreJar=F:/MCRPG/Klaymore/build/libs/klaymore-501f74f-master+501f74f652-dirty-dev.jar

# -------------------------------------------------------------------------
# 4. 额外 Mod JAR【可选，按需填写】
# -------------------------------------------------------------------------
# 你的脚本需要引用的其他 Mod API（如 IC2、GregTech、NEI 等）
# 填这些 Mod 的 JAR 路径（通常是服务端 mods/ 目录里的 JAR）
# 生成器会自动用 rfg.deobf(files("...")) 包裹，让 IDE 显示反混淆类名。
#
# 两种填写方式：
#
#   方式 A（逗号分隔，一行写完）:
#       extraJars=F:/mods/IC2.jar,F:/mods/GregTech.jar,F:/mods/NEI-api.jar
#
#   方式 B（编号多行，推荐，清晰且支持顺序）:
#       extraJar.1=F:/mods/IC2.jar
#       extraJar.2=F:/mods/GregTech-api.jar
#       extraJar.3=F:/mods/SomeOtherMod.jar
#       （可以继续写 extraJar.4、extraJar.5 ... 无限编号）
#
# 两种方式可以同时使用，会合并去重。
# -------------------------------------------------------------------------

# 方式 A：逗号分隔（示例，删除 # 启用）
#extraJars=

# 方式 B：编号多行（示例，删除 # 启用并修改路径）
#extraJar.1=
#extraJar.2=
#extraJar.3=

# -------------------------------------------------------------------------
# 5. Minecraft / Forge 开发环境 JAR【★ 强烈建议填写 · 方案 B · 直接解决 IDEA External Libraries 不显示】
# -------------------------------------------------------------------------
#  方案 A（自动）：不填 → RFG 插件会根据上面的版本号（minecraftVersion / forgeVersion）
#                 自动下载 + 反混淆 Minecraft/Forge，然后通过 patchedMinecraft configuration
#                 挂到 classpath。但某些 IDEA Gradle Tooling API 版本对非 Maven 坐标
#                 extendsFrom/自定义 configuration 快照不稳定 → 可能出现"Forge 有 MC 无"。
#
#  方案 B（手动，★★★ 推荐，100% 稳）：填下面两个本地 JAR 路径 → 生成器会用
#                 `implementation(files("路径"))` **裸挂本地文件依赖**，
#                 IDEA 一定能识别到 External Libraries，不依赖任何 Gradle 中间管道。
#
# ===== 去哪找这两个 JAR？=====
#  A) 从 Klaymore 主项目找（推荐，版本完全一致）：
#      - Minecraft Dev JAR:  Klaymore主项目 / build / rfg / recompiled_minecraft-1.7.10.jar
#        （如果没有，在 Klaymore 主项目跑一次 `gradlew build` 就会生成）
#      - Forge JAR:          Klaymore主项目 / build / rfg / forge-1.7.10-10.13.4.1614-universal.jar
#
#  B) 从 GTNH / 其他 Mod 项目找：
#      - 任何用 RFG 2.x + MC 1.7.10 的项目，build/rfg/ 目录下的 recompiled_minecraft-1.7.10.jar
#
#  C) 从 GregTech / 你自己的服务端开发缓存里找（路径略有不同，文件名带 minecraft + dev/deobf 字样即可）
#
#  填完后重新 generate 项目 → IDEA 打开就能立即看到 Minecraft / Forge / Klaymore 三类依赖。
# -------------------------------------------------------------------------
#
# 示例：
# minecraftDevJar=F:/MCRPG/Klaymore/build/rfg/recompiled_minecraft-1.7.10.jar
# forgeJar=F:/MCRPG/Klaymore/build/rfg/forge-1.7.10-10.13.4.1614-universal.jar
#
# ★ 已自动探测（generate_project.py validate 时会告诉你真实存在性）：
#   → Minecraft Dev JAR 已在 Klaymore 主项目 build/rfg/ 找到，直接启用下面这行即可：
minecraftDevJar=F:/MCRPG/Klaymore/build/rfg/recompiled_minecraft-1.7.10.jar
#
#   → Forge Universal JAR：可能在 Gradle User Home caches 里（Maven 坐标 net.minecraftforge:forge:1.7.10-10.13.4.1614:universal）。
#     如果找不到没关系，IDEA External Libraries 里已经能通过 net.minecraftforge:forge 的 Maven 坐标看到它；
#     你只要把上面那行 Minecraft Dev JAR 打开，Minecraft + Klaymore 就全部能显示了。
minecraftDevJar=F:/MCRPG/Klaymore/build/rfg/recompiled_minecraft-1.7.10.jar
forgeJar=
