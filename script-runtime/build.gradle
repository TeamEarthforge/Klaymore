plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

def kotlin_version = "2.1.10"

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-script-runtime:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-common:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-jvm:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-jvm-host:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
}

// ================================================================
// 公共 shadow 配置（排除 Java 9+ 字节码等 Forge 1.7.10 不兼容的内容）
// ================================================================
def commonShadowConfig = {
    zip64 = true
    mergeServiceFiles()
    exclude 'META-INF/versions/**'
    exclude 'module-info.class'
    exclude 'META-INF/services/java.lang.invoke.MethodHandles$Lookup'
}

// ================================================================
// 运行时 JAR（玩家版必需）：stdlib + 脚本 API + 协程
// 不含 Kotlin 编译器，体积约 6-8MB
// ================================================================
def shadowJarTask = tasks.named('shadowJar')
shadowJarTask.configure commonShadowConfig >> {
    archiveBaseName.set('klaymore-runtime')
    archiveClassifier.set('')
    archiveVersion.set('')

    dependencies {
        // 排除编译器相关的 3 个库（放到 klaymore-runtime-compiler.jar）
        exclude(dependency('org.jetbrains.kotlin:kotlin-compiler-embeddable'))
        exclude(dependency('org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable'))
        exclude(dependency('org.jetbrains.kotlin:kotlin-scripting-jvm-host'))
    }

    // 运行时 jar 不包含 SRG minecraft dummy（只在 compiler jar 里）
    exclude 'klaymore/minecraft-1.7.10-srg.jar'

    def cacheDirPath = layout.buildDirectory.dir('tmp/.cache/expanded').get().asFile.absolutePath
    def tmpJarPath = layout.buildDirectory.dir('tmp/jar').get().asFile.absolutePath
    def tmpShadowPath = layout.buildDirectory.dir('tmp/shadowJar').get().asFile.absolutePath
    doLast {
        def deleteRec
        deleteRec = { File f ->
            if (!f.exists()) return
            if (f.isDirectory()) {
                f.listFiles().each { deleteRec(it) }
            }
            f.delete()
        }

        File cacheDir = new File(cacheDirPath)
        if (cacheDir.exists()) {
            int fileCount = 0
            cacheDir.eachFileRecurse(groovy.io.FileType.FILES) { fileCount++ }
            deleteRec(cacheDir)
            println "[script-runtime] 已清理解压缓存: ${cacheDir.path} (${fileCount} 个文件)"
        }
        File tmpJar = new File(tmpJarPath)
        if (tmpJar.exists()) deleteRec(tmpJar)
        File tmpShadow = new File(tmpShadowPath)
        if (tmpShadow.exists()) deleteRec(tmpShadow)

        // builtins 自检（kotlin.kotlin_builtins 在 stdlib 里）
        def jarFile = archiveFile.get().asFile
        def builtinOk = false
        try {
            def fs = java.nio.file.FileSystems.newFileSystem(jarFile.toPath(), null as ClassLoader)
            try {
                builtinOk = java.nio.file.Files.exists(fs.getPath("kotlin/kotlin.kotlin_builtins"))
            } finally { fs.close() }
        } catch (Throwable t) {
            println "[script-runtime] ⚠ builtins 自检失败: ${t.message}"
            builtinOk = false
        }
        println "[script-runtime] ✔ runtime builtins 自检: ${builtinOk ? 'OK' : 'NOT FOUND!!!'}"
        println "[script-runtime] ✔ runtime 构建完成，大小: ${String.format('%.2f', jarFile.length()/1024/1024)} MB"
    }
}

// ================================================================
// 编译器 JAR（开发版额外需要）：Kotlin 编译器 + 脚本编译器
// 体积约 50-60MB，玩家版不需要
// ================================================================
// 用 Jar 任务直接打包，避免依赖 shadow 插件的 ShadowJar 类型（配置阶段无法解析）。
task shadowJarCompiler(type: Jar) {
    archiveBaseName.set('klaymore-runtime-compiler')
    archiveClassifier.set('')
    archiveVersion.set('')
    zip64 = true

    // 只打包编译器相关的 3 个库，排除运行时 jar 已提供的库
    from {
        def compilerLibs = [
            'kotlin-compiler-embeddable',
            'kotlin-scripting-compiler-embeddable',
            'kotlin-scripting-jvm-host'
        ]
        configurations.runtimeClasspath.files.findAll { f ->
            compilerLibs.any { f.name.contains(it) }
        }.collect { zipTree(it) }
    }

    // 打包 SRG 命名的 Minecraft dummy jar（编译期 classpath 用，不参与运行时加载）
    from('src/main/resources') {
        include 'klaymore/minecraft-1.7.10-srg.jar'
    }

    // 合并 META-INF/services（kotlin 编译器依赖服务发现）
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 排除 Forge 1.7.10 不兼容的内容
    exclude 'META-INF/versions/**'
    exclude 'module-info.class'
    exclude 'META-INF/services/java.lang.invoke.MethodHandles$Lookup'

    doLast {
        def jarFile = archiveFile.get().asFile
        println "[script-runtime] ✔ compiler 构建完成，大小: ${String.format('%.2f', jarFile.length()/1024/1024)} MB"
    }
}

// ================================================================
// 复制产物到主项目 libs/
// ================================================================
def libsDirFile = new File(rootProject.projectDir, 'libs')
def libsDirPath = libsDirFile.absolutePath
def runtimeJarPath = new File(libsDirFile, 'klaymore-runtime.jar').absolutePath
def compilerJarPath = new File(libsDirFile, 'klaymore-runtime-compiler.jar').absolutePath

task copyRuntime(type: Copy, dependsOn: shadowJarTask) {
    from(shadowJarTask.flatMap { it.archiveFile })
    into(libsDirFile)
    doLast {
        File targetFile = new File(runtimeJarPath)
        println "[script-runtime] runtime 已复制到: ${targetFile.absolutePath}"
        println "[script-runtime] runtime 大小: ${String.format('%.2f', targetFile.length()/1024/1024)} MB"
    }
}

task copyCompilerRuntime(type: Copy, dependsOn: 'shadowJarCompiler') {
    from(tasks.named('shadowJarCompiler').flatMap { it.archiveFile })
    into(libsDirFile)
    doLast {
        File targetFile = new File(compilerJarPath)
        println "[script-runtime] compiler runtime 已复制到: ${targetFile.absolutePath}"
        println "[script-runtime] compiler runtime 大小: ${String.format('%.2f', targetFile.length()/1024/1024)} MB"
    }
}

build.dependsOn copyRuntime, copyCompilerRuntime

artifacts {
    shadow shadowJarTask
}
