plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

def kotlin_version = "2.1.10"

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-script-runtime:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-common:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-jvm:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-jvm-host:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
}

def shadowJarTask = tasks.named('shadowJar')

shadowJarTask.configure {
    archiveBaseName.set('klaymore-runtime')
    archiveClassifier.set('')
    archiveVersion.set('')

    zip64 = true
    mergeServiceFiles()

    // 必须保留：排除 Multi-Release JAR 的 META-INF/versions/** 目录
    // Forge 1.7.10 用的 ASM 5.0.3 无法识别 Java 9+ 字节码，
    // 扫描到 META-INF/versions/9 的 class 会抛 IllegalArgumentException 导致整个 JAR 被 ignore
    exclude 'META-INF/versions/**'
    exclude 'module-info.class'
    // 排除 jdk unsupported / 8+ 版本的反射工厂
    exclude 'META-INF/services/java.lang.invoke.MethodHandles$Lookup'

    // ========================================================================
    // ⭐⭐⭐ 最关键：对 kotlin / kotlinx / org.jetbrains.kotlin 这些包，
    //              完全！不！做！ relocate！
    // ========================================================================
    //
    // 为什么之前 relocate 出了无穷无尽的 bug？
    //   1. relocate 不仅搬移 class，还会重写 class 里的字符串常量（包名）。
    //      FirFallbackBuiltinSymbolProvider.<clinit> 里拼的 "kotlin/kotlin.kotlin_builtins"
    //      这个字符串会被替换成各种"二次污染"的路径，和 JAR 内实际资源路径不匹配。
    //   2. 开发环境 runClient 下 Forge 直接加载 build/classes/kotlin/main 目录，
    //      不走 shadowJar，主模块 ScriptContainer 引用 kotlin.Any 是原始名；
    //      但 runtime jar relocate 后编译器只认 shadow.kotlin.Any，
    //      两套命名空间并存 → "Cannot access class 'kotlin.Any' / Missing stdlib class"。
    //   3. builtins 找资源需要：类路径 FQN 拼的资源字符串 == JAR 内实际资源路径，
    //      relocate 同时改 class FQN + 字符串常量 + 搬移资源，三个机制很难同步一致。
    //
    // Forge 1.7.10 环境根本没有其他 mod 带 Kotlin（2014 年 Kotlin 才 1.0 刚出来），
    // 完全不存在类冲突，所以 relocate 纯属自找麻烦。全部删除，直接原名打包。
    //
    // 只对极少数可能和其他 mods 冲突的第三方小依赖做 relocate（但目前也没必要，都跳过）。

    // ⭐ 也不要做 eachFile 资源重定位。 kotlin/kotlin.kotlin_builtins 就保持在
    //    kotlin/kotlin.kotlin_builtins，让编译器怎么拼都找得到。

    // 用纯 JDK 的文件删除操作（不调用 project.delete / buildDir / file() 等 Gradle 配置期对象）
    // 避免 configuration cache 报"执行期访问配置期状态"错误。
    def cacheDirPath = layout.buildDirectory.dir('tmp/.cache/expanded').get().asFile.absolutePath
    def tmpJarPath = layout.buildDirectory.dir('tmp/jar').get().asFile.absolutePath
    def tmpShadowPath = layout.buildDirectory.dir('tmp/shadowJar').get().asFile.absolutePath
    doLast {
        // 递归删除辅助（不依赖 Gradle）
        def deleteRec
        deleteRec = { File f ->
            if (!f.exists()) return
            if (f.isDirectory()) {
                f.listFiles().each { deleteRec(it) }
            }
            f.delete()
        }

        File cacheDir = new File(cacheDirPath)
        if (cacheDir.exists()) {
            int fileCount = 0
            cacheDir.eachFileRecurse(groovy.io.FileType.FILES) { fileCount++ }
            deleteRec(cacheDir)
            println "[script-runtime] 已清理解压缓存: ${cacheDir.path} (${fileCount} 个文件)"
        }
        File tmpJar = new File(tmpJarPath)
        if (tmpJar.exists()) deleteRec(tmpJar)
        File tmpShadow = new File(tmpShadowPath)
        if (tmpShadow.exists()) deleteRec(tmpShadow)

        // 快速自检：确保 kotlin/kotlin.kotlin_builtins 在正确位置
        def jarFile = archiveFile.get().asFile
        def builtinOk = false
        try {
            def fs = java.nio.file.FileSystems.newFileSystem(jarFile.toPath(), null as ClassLoader)
            try {
                builtinOk = java.nio.file.Files.exists(fs.getPath("kotlin/kotlin.kotlin_builtins"))
            } finally { fs.close() }
        } catch (Throwable t) {
            println "[script-runtime] ⚠ builtins 自检失败: ${t.message}"
            builtinOk = false
        }
        println "[script-runtime] ✔ builtins 位置自检 kotlin/kotlin.kotlin_builtins: ${builtinOk ? 'OK' : 'NOT FOUND!!!'}"
        println "[script-runtime] ✔ 构建完成，大小: ${String.format('%.2f', jarFile.length()/1024/1024)} MB（未 relocate 原版）"
    }
}

// 注意：提前在"配置期"解析目标路径为字符串，避免 doFirst/doLast 执行期闭包内
// 直接引用 rootProject / file() 等 Gradle 对象触发 configuration cache 报错。
def libsDirFile = new File(rootProject.projectDir, 'libs')
def libsDirPath = libsDirFile.absolutePath
def runtimeJarPath = new File(libsDirFile, 'klaymore-runtime.jar').absolutePath

task copyRuntime(type: Copy, dependsOn: shadowJarTask) {
    from(shadowJarTask.flatMap { it.archiveFile })
    into(libsDirFile)
    doLast {
        File targetFile = new File(runtimeJarPath)
        println "[script-runtime] 运行库已复制到: ${targetFile.absolutePath}"
        println "[script-runtime] 大小: ${String.format('%.2f', targetFile.length()/1024/1024)} MB"
    }
}

build.dependsOn copyRuntime

artifacts {
    shadow shadowJarTask
}
