plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

def kotlin_version = "2.1.10"

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-script-runtime:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-common:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-jvm:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-jvm-host:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
}

def shadowJarTask = tasks.named('shadowJar')

shadowJarTask.configure {
    archiveBaseName.set('klaymore-runtime')
    archiveClassifier.set('')
    archiveVersion.set('')

    zip64 = true
    mergeServiceFiles()

    // ⭐ 核心修复：排除 Multi-Release JAR 的 META-INF/versions/** 目录
    // 1.7.10 Forge 使用 ASM 5.0.3，无法识别 Java 9+ 字节码，
    // 扫描到 META-INF/versions/9 的 Java 9 class 会抛 IllegalArgumentException 导致整个 JAR 被 ignore
    exclude 'META-INF/versions/**'
    // 顺带排除 module-info (Java 9 module descriptor) 和 kotlin-to-jvm-module 标记的非必须 META-INF
    exclude 'module-info.class'
    exclude 'META-INF/*.kotlin_metadata'
    exclude 'META-INF/*.kotlin_module'
    // 排除 jdk unsupported / 8+ 版本的反射工厂
    exclude 'META-INF/services/java.lang.invoke.MethodHandles$Lookup'

    relocate 'kotlin', 'com.earthforge.klaymore.shadow.kotlin'
    relocate 'kotlinx', 'com.earthforge.klaymore.shadow.kotlinx'
    relocate 'org.jetbrains.kotlin', 'com.earthforge.klaymore.shadow.org.jetbrains.kotlin'
    relocate 'org.jetbrains.annotations', 'com.earthforge.klaymore.shadow.org.jetbrains.annotations'
    relocate 'org.intellij.lang.annotations', 'com.earthforge.klaymore.shadow.org.intellij.lang.annotations'
    relocate 'org.codehaus', 'com.earthforge.klaymore.shadow.org.codehaus'
    relocate 'org.jdom', 'com.earthforge.klaymore.shadow.org.jdom'

    doLast {
        def cacheDir = file("${buildDir}/tmp/.cache/expanded")
        if (cacheDir.exists()) {
            def fileCount = 0
            cacheDir.eachFileRecurse(groovy.io.FileType.FILES) { fileCount++ }
            project.delete(cacheDir)
            println "[script-runtime] 已清理解压缓存: ${cacheDir.path} (${fileCount} 个文件)"
        }
        def tmpJar = file("${buildDir}/tmp/jar")
        if (tmpJar.exists()) project.delete(tmpJar)
        def tmpShadow = file("${buildDir}/tmp/shadowJar")
        if (tmpShadow.exists()) project.delete(tmpShadow)
    }
}

task copyRuntime(type: Copy, dependsOn: shadowJarTask) {
    from(shadowJarTask.flatMap { it.archiveFile })
    into(rootProject.file('libs'))
    doFirst {
        into(rootProject.file('libs'))
    }
    doLast {
        def targetFile = rootProject.file('libs/klaymore-runtime.jar')
        println "[script-runtime] 运行库已复制到: ${targetFile.absolutePath}"
        println "[script-runtime] 大小: ${String.format('%.2f', targetFile.length()/1024/1024)} MB"
    }
}

build.dependsOn copyRuntime

artifacts {
    shadow shadowJarTask
}
